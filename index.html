<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GRAND X — Ombor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            GRAND <span>X</span>
        </div>

        <div class="header-text">
            OMBOR BOSHQARUV TIZIMI
        </div>

        <!-- КНОПКА УВЕДОМЛЕНИЙ -->

        <button
            id="outBell"
            class="notification-bell"
            type="button"
            onclick="toggleOutPopup()"
            aria-label="Tugagan mahsulotlar"
        >
            🔔

            <span
                id="outBadge"
                class="out-badge hidden"
            >
                0
            </span>
        </button>

    </header>


    <!-- =========================
         POPUP TUGAGAN MAHSULOTLAR
    ========================== -->

    <div
        id="outPopup"
        class="out-popup"
        aria-hidden="true"
    >

        <div class="out-popup-header">

            <strong>
                TUGAGAN MAHSULOTLAR
            </strong>

            <button
                class="out-popup-close"
                type="button"
                onclick="closeOutPopup()"
            >
                ×
            </button>

        </div>


        <div
            id="outPopupList"
            class="out-popup-list"
        >
        </div>

    </div>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">


        <!-- =========================
             STATISTIKA
        ========================== -->

        <section class="stats">


            <div class="stat-card">

                <span class="stat-title">
                    MAHSULOTLAR
                </span>

                <strong id="productCount">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-title">
                    JAMI MIQDOR
                </span>

                <strong id="totalStock">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-title">
                    KAM QOLGAN
                </span>

                <strong id="lowStock">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-title">
                    TUGAGAN
                </span>

                <strong id="outStock">
                    0
                </strong>

            </div>


        </section>


        <!-- =========================
             MESSAGE
        ========================== -->

        <div
            id="message"
            class="message"
        >
        </div>


        <!-- =========================
             YANGI MAHSULOT
        ========================== -->

        <section class="panel">

            <h2>
                YANGI MAHSULOT
            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label for="productName">
                        MAHSULOT NOMI
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Mahsulot nomi"
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label for="productQuantity">
                        MIQDOR
                    </label>

                    <input
                        type="number"
                        id="productQuantity"
                        min="0"
                        step="1"
                        placeholder="0"
                    >

                </div>


                <div class="form-group">

                    <label for="lowLimit">
                        MINIMAL MIQDOR
                    </label>

                    <input
                        type="number"
                        id="lowLimit"
                        min="0"
                        step="1"
                        value="5"
                    >

                </div>


                <button
                    id="addBtn"
                    class="main-btn"
                    type="button"
                    onclick="addProduct()"
                >
                    MAHSULOT QO‘SHISH
                </button>


            </div>

        </section>


        <!-- =========================
             QIDIRUV
        ========================== -->

        <section class="panel search-panel">

            <h2>
                QIDIRUV
            </h2>

            <input
                type="text"
                id="search"
                placeholder="Mahsulot nomi bo‘yicha qidiring..."
                autocomplete="off"
            >

        </section>


        <!-- =========================
             WARNING
        ========================== -->

        <div
            id="warning"
            class="warning"
        >
        </div>


        <!-- =========================
             BILDIRISHNOMALAR
        ========================== -->

        <section class="panel">

            <h2>
                BILDIRISHNOMALAR
            </h2>

            <div id="notifications">
            </div>

        </section>


        <!-- =========================
             MAHSULOTLAR JADVALI
        ========================== -->

        <section class="panel products-panel">

            <h2>
                MAHSULOTLAR RO‘YXATI
            </h2>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                MAHSULOT
                            </th>

                            <th>
                                MIQDOR
                            </th>

                            <th>
                                MINIMAL
                            </th>

                            <th>
                                HOLAT
                            </th>

                            <th>
                                AMALLAR
                            </th>

                        </tr>

                    </thead>


                    <tbody id="productTable">
                    </tbody>

                </table>

            </div>

        </section>


    </main>


    <!-- =========================
         EDIT MODAL
    ========================== -->

    <div
        id="editModal"
        class="modal"
    >

        <div class="modal-content">


            <div class="modal-header">

                <h2>
                    Mahsulotni tahrirlash
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    onclick="closeEdit()"
                >
                    ×
                </button>

            </div>


            <!-- ID -->

            <input
                type="hidden"
                id="editId"
            >


            <!-- НАЗВАНИЕ -->

            <div class="form-group">

                <label for="editName">
                    MAHSULOT NOMI
                </label>

                <input
                    type="text"
                    id="editName"
                    autocomplete="off"
                >

            </div>


            <!-- КОЛИЧЕСТВО -->

            <div class="form-group">

                <label for="editQuantity">
                    MIQDOR
                </label>

                <input
                    type="number"
                    id="editQuantity"
                    min="0"
                    step="1"
                >

            </div>


            <!-- МИНИМАЛЬНОЕ -->

            <div class="form-group">

                <label for="editLowLimit">
                    MINIMAL MIQDOR
                </label>

                <input
                    type="number"
                    id="editLowLimit"
                    min="0"
                    step="1"
                >

            </div>


            <!-- КНОПКИ -->

            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="closeEdit()"
                >
                    BEKOR QILISH
                </button>


                <button
                    type="button"
                    class="main-btn"
                    onclick="saveEdit()"
                >
                    SAQLASH
                </button>

            </div>


        </div>

    </div>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
