```html
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GRAND X — Ombor</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <h1>GRAND <span>X</span></h1>
        <p>OMBOR BOSHQARUV TIZIMI</p>
    </div>
</header>


<main class="container">

    <!-- STATISTIKA -->
    <section class="stats">

        <div class="stat-card">
            <span>MAHSULOTLAR</span>
            <strong id="totalProducts">0</strong>
        </div>

        <div class="stat-card">
            <span>JAMI MIQDOR</span>
            <strong id="totalQuantity">0</strong>
        </div>

        <div class="stat-card warning-card">
            <span>KAM QOLGAN</span>
            <strong id="lowProducts">0</strong>
        </div>

        <div class="stat-card danger-card">
            <span>TUGAGAN</span>
            <strong id="outProducts">0</strong>
        </div>

    </section>


    <!-- YANGI MAHSULOT -->
    <section class="panel">

        <div class="section-title">
            <div>
                <small>OMBOR</small>
                <h2>YANGI MAHSULOT</h2>
            </div>
        </div>

        <div class="add-form">

            <div class="field">
                <label>MAHSULOT NOMI</label>

                <input
                    id="productName"
                    type="text"
                    placeholder="Masalan: Coca Cola"
                    autocomplete="off"
                >
            </div>


            <div class="field">
                <label>MIQDORI</label>

                <input
                    id="productQuantity"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >
            </div>


            <div class="field">
                <label>MINIMAL MIQDOR</label>

                <input
                    id="productLowLimit"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0"
                >
            </div>


            <button
                class="main-btn"
                id="addButton"
                onclick="addProduct()"
            >
                <span>+</span>
                QO‘SHISH
            </button>

        </div>

        <div id="message"></div>

    </section>


    <!-- QIDIRUV -->
    <section class="search-box">

        <div class="search-icon">⌕</div>

        <input
            id="searchInput"
            type="text"
            placeholder="Mahsulot qidirish..."
            autocomplete="off"
        >

    </section>


    <!-- OGOHLANTIRISHLAR -->
    <section id="stockNotifications"></section>


    <!-- MAHSULOTLAR -->
    <section class="panel table-panel">

        <div class="section-title table-title">

            <div>
                <small>BAZA</small>
                <h2>MAHSULOTLAR</h2>
            </div>

            <div
                id="lastUpdate"
                class="last-update"
            >
                Yangilanmoqda...
            </div>

        </div>


        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>MAHSULOT</th>
                        <th>MIQDOR</th>
                        <th>MINIMAL</th>
                        <th>HOLAT</th>
                        <th>AMALLAR</th>
                    </tr>
                </thead>

                <tbody id="productsTable"></tbody>

            </table>

        </div>

    </section>

</main>


<!-- TAHRIRLASH MODALI -->

<div
    id="editModal"
    class="modal-overlay"
>

    <div class="modal">

        <div class="modal-header">

            <div>
                <small>MAHSULOT</small>
                <h2>TAHRIRLASH</h2>
            </div>

            <button
                class="modal-close"
                onclick="closeEdit()"
            >
                ×
            </button>

        </div>


        <div class="modal-field">
            <label>MAHSULOT NOMI</label>

            <input
                id="editName"
                type="text"
            >
        </div>


        <div class="modal-field">
            <label>MIQDORI</label>

            <input
                id="editQuantity"
                type="number"
                min="0"
                step="1"
            >
        </div>


        <div class="modal-field">
            <label>MINIMAL MIQDOR</label>

            <input
                id="editLowLimit"
                type="number"
                min="0"
                step="1"
            >
        </div>


        <div class="modal-buttons">

            <button
                class="save-btn"
                onclick="saveEdit()"
            >
                SAQLASH
            </button>

            <button
                class="cancel-btn"
                onclick="closeEdit()"
            >
                BEKOR QILISH
            </button>

        </div>

    </div>

</div>


<script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
        "https://szgtlkykyfacjliisigf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_yFGFSQb4K_gR-3KTqckJlQ_rF__5tfI";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let products = [];
    let editingId = null;


    /* =========================================
       HTML XAVFSIZLIGI
    ========================================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    /* =========================================
       XATOLIKNI CHIQARISH
    ========================================= */

    function getSupabaseError(error) {

        if (!error) {
            return "Noma'lum xatolik";
        }

        return [
            error.message,
            error.details,
            error.hint,
            error.code
        ]
        .filter(Boolean)
        .join(" | ");
    }


    /* =========================================
       XABAR
    ========================================= */

    function showMessage(text, type = "error") {

        const box =
            document.getElementById("message");

        box.className =
            "message " + type;

        box.textContent =
            text;

        clearTimeout(
            window.messageTimer
        );

        window.messageTimer =
            setTimeout(() => {

                box.className = "";
                box.textContent = "";

            }, 5000);
    }


    /* =========================================
       MAHSULOTLARNI YUKLASH
    ========================================= */

    async function loadProducts() {

        const { data, error } =
            await supabaseClient
                .from("products")
                .select(
                    "id, created_at, name, quantity, low_limit"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "SUPABASE LOAD ERROR:",
                error
            );

            showMessage(
                "Baza xatosi: " +
                getSupabaseError(error),
                "error"
            );

            return;
        }


        products =
            Array.isArray(data)
                ? data
                : [];


        renderProducts();
        updateStats();
        renderStockNotifications();


        document.getElementById(
            "lastUpdate"
        ).textContent =
            "Yangilandi: " +
            new Date().toLocaleTimeString(
                "uz-UZ",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );
    }


    /* =========================================
       MAHSULOT QO'SHISH
    ========================================= */

    async function addProduct() {

        const nameInput =
            document.getElementById(
                "productName"
            );

        const quantityInput =
            document.getElementById(
                "productQuantity"
            );

        const lowLimitInput =
            document.getElementById(
                "productLowLimit"
            );


        const name =
            nameInput.value.trim();


        const quantity =
            Number(
                quantityInput.value
            );


        const lowLimit =
            Number(
                lowLimitInput.value
            );


        /* NOM */

        if (!name) {

            showMessage(
                "Mahsulot nomini kiriting.",
                "error"
            );

            nameInput.focus();

            return;
        }


        /* MIQDOR */

        if (
            !Number.isInteger(quantity) ||
            quantity < 0
        ) {

            showMessage(
                "Miqdor butun musbat son bo‘lishi kerak.",
                "error"
            );

            quantityInput.focus();

            return;
        }


        /* MINIMAL */

        if (
            !Number.isInteger(lowLimit) ||
            lowLimit < 0
        ) {

            showMessage(
                "Minimal miqdor butun musbat son bo‘lishi kerak.",
                "error"
            );

            lowLimitInput.focus();

            return;
        }


        const button =
            document.getElementById(
                "addButton"
            );

        button.disabled = true;
        button.classList.add("loading");


        /*
            MUHIM:
            Faqat mavjud ustunlar yuboriladi.
            id va created_at yuborilmaydi.
            image ham yo‘q.
        */

        const insertData = {
            name: name,
            quantity: quantity,
            low_limit: lowLimit
        };


        console.log(
            "INSERT DATA:",
            insertData
        );


        const {
            data,
            error
        } = await supabaseClient
            .from("products")
            .insert(insertData)
            .select(
                "id, created_at, name, quantity, low_limit"
            );


        button.disabled = false;
        button.classList.remove("loading");


        if (error) {

            console.error(
                "SUPABASE INSERT ERROR:",
                error
            );

            showMessage(
                "Supabase xatosi: " +
                getSupabaseError(error),
                "error"
            );

            return;
        }


        console.log(
            "INSERT SUCCESS:",
            data
        );


        nameInput.value = "";
        quantityInput.value = "";
        lowLimitInput.value = "";


        showMessage(
            "Mahsulot muvaffaqiyatli qo‘shildi.",
            "success"
        );


        await loadProducts();

        nameInput.focus();
    }


    /* =========================================
       MIQDORNI YANGILASH
    ========================================= */

    async function updateQuantity(
        id,
        quantity
    ) {

        const newQuantity =
            Number(quantity);


        if (
            !Number.isInteger(newQuantity) ||
            newQuantity < 0
        ) {

            return;
        }


        const {
            error
        } = await supabaseClient
            .from("products")
            .update({
                quantity: newQuantity
            })
            .eq("id", id);


        if (error) {

            console.error(
                "QUANTITY ERROR:",
                error
            );

            showMessage(
                "Miqdor o‘zgartirilmadi: " +
                getSupabaseError(error),
                "error"
            );

            return;
        }


        const product =
            products.find(
                item => item.id === id
            );


        if (product) {

            product.quantity =
                newQuantity;
        }


        renderProducts();
        updateStats();
        renderStockNotifications();
    }


    /* =========================================
       + / -
    ========================================= */

    async function changeQuantity(
        id,
        amount
    ) {

        const product =
            products.find(
                item => item.id === id
            );


        if (!product) {
            return;
        }


        const current =
            Number(product.quantity) || 0;


        const next =
            Math.max(
                0,
                current + amount
            );


        await updateQuantity(
            id,
            next
        );
    }


    /* =========================================
       MIQDORNI QO'LDA O'ZGARTIRISH
    ========================================= */

    async function setQuantity(
        id,
        input
    ) {

        const value =
            Number(input.value);


        if (
            !Number.isInteger(value) ||
            value < 0
        ) {

            const product =
                products.find(
                    item => item.id === id
                );

            input.value =
                product
                    ? product.quantity
                    : 0;

            return;
        }


        await updateQuantity(
            id,
            value
        );
    }


    /* =========================================
       MINIMAL MIQDOR
    ========================================= */

    async function setLowLimit(
        id,
        input
    ) {

        const value =
            Number(input.value);


        if (
            !Number.isInteger(value) ||
            value < 0
        ) {

            const product =
                products.find(
                    item => item.id === id
                );

            input.value =
                product
                    ? product.low_limit
                    : 0;

            return;
        }


        const {
            error
        } = await supabaseClient
            .from("products")
            .update({
                low_limit: value
            })
            .eq("id", id);


        if (error) {

            console.error(
                "LOW LIMIT ERROR:",
                error
            );

            showMessage(
                "Minimal miqdor o‘zgartirilmadi: " +
                getSupabaseError(error),
                "error"
            );

            return;
        }


        const product =
            products.find(
                item => item.id === id
            );


        if (product) {

            product.low_limit =
                value;
        }


        renderProducts();
        updateStats();
        renderStockNotifications();
    }


    /* =========================================
       TAHRIRLASHNI OCHISH
    ========================================= */

    function openEdit(id) {

        const product =
            products.find(
                item => item.id === id
            );


        if (!product) {
            return;
        }


        editingId = id;


        document.getElementById(
            "editName"
        ).value =
            product.name ?? "";


        document.getElementById(
            "editQuantity"
        ).value =
            Number(product.quantity) || 0;


        document.getElementById(
            "editLowLimit"
        ).value =
            Number(product.low_limit) || 0;


        document.getElementById(
            "editModal"
        ).classList.add("active");


        document.getElementById(
            "editName"
        ).focus();
    }


    /* =========================================
       TAHRIRLASHNI YOPISH
    ========================================= */

    function closeEdit() {

        editingId = null;

        document.getElementById(
            "editModal"
        ).classList.remove("active");
    }


    /* =========================================
       TAHRIRLASHNI SAQLASH
    ========================================= */

    async function saveEdit() {

        if (!editingId) {
            return;
        }


        const name =
            document.getElementById(
                "editName"
            ).value.trim();


        const quantity =
            Number(
                document.getElementById(
                    "editQuantity"
                ).value
            );


        const lowLimit =
            Number(
                document.getElementById(
                    "editLowLimit"
                ).value
            );


        if (!name) {

            showMessage(
                "Mahsulot nomini kiriting.",
                "error"
            );

            return;
        }


        if (
            !Number.isInteger(quantity) ||
            quantity < 0
        ) {

            showMessage(
                "Miqdorni to‘g‘ri kiriting.",
                "error"
            );

            return;
        }


        if (
            !Number.isInteger(lowLimit) ||
            lowLimit < 0
        ) {

            showMessage(
                "Minimal miqdorni to‘g‘ri kiriting.",
                "error"
            );

            return;
        }


        const updateData = {
            name: name,
            quantity: quantity,
            low_limit: lowLimit
        };


        console.log(
            "UPDATE DATA:",
            updateData
        );


        const {
            error
        } = await supabaseClient
            .from("products")
            .update(updateData)
            .eq("id", editingId);


        if (error) {

            console.error(
                "UPDATE ERROR:",
                error
            );

            showMessage(
                "Saqlashda xatolik: " +
                getSupabaseError(error),
                "error"
            );

            return;
        }


        closeEdit();


        showMessage(
            "Mahsulot yangilandi.",
            "success"
        );


        await loadProducts();
    }


    /* =========================================
       O'CHIRISH
    ========================================= */

    async function deleteProduct(id) {

        const product =
            products.find(
                item => item.id === id
            );


        if (!product) {
            return;
        }


        const confirmed =
            confirm(
                `"${product.name}" mahsulotini o‘chirishni xohlaysizmi?`
            );


        if (!confirmed) {
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


        if (error) {

            console.error(
                "DELETE ERROR:",
                error
            );

            showMessage(
                "Mahsulot o‘chirilmadi: " +
                getSupabaseError(error),
                "error"
            );

            return;
        }


        showMessage(
            "Mahsulot o‘chirildi.",
            "success"
        );


        await loadProducts();
    }


    /* =========================================
       STATUS
    ========================================= */

    function getStatus(product) {

        const quantity =
            Number(product.quantity) || 0;


        const lowLimit =
            Number(product.low_limit) || 0;


        if (quantity === 0) {

            return {
                text: "TUGAGAN",
                className: "out"
            };
        }


        if (
            quantity <= lowLimit
        ) {

            return {
                text: "KAM QOLDI",
                className: "low"
            };
        }


        return {
            text: "YETARLI",
            className: "good"
        };
    }


    /* =========================================
       TABLE
    ========================================= */

    function renderProducts() {

        const table =
            document.getElementById(
                "productsTable"
            );


        const search =
            document.getElementById(
                "searchInput"
            ).value
            .toLowerCase()
            .trim();


        const filtered =
            products.filter(
                product =>
                    String(
                        product.name ?? ""
                    )
                    .toLowerCase()
                    .includes(search)
            );


        if (filtered.length === 0) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty"
                    >
                        ${
                            search
                                ? "Mahsulot topilmadi"
                                : "Hozircha mahsulot yo‘q"
                        }
                    </td>
                </tr>
            `;

            return;
        }


        table.innerHTML =
            filtered.map(product => {

                const status =
                    getStatus(product);


                const quantity =
                    Number(
                        product.quantity
                    ) || 0;


                const lowLimit =
                    Number(
                        product.low_limit
                    ) || 0;


                return `

                    <tr>

                        <td class="product-name">
                            ${escapeHTML(
                                product.name
                            )}
                        </td>


                        <td>

                            <div class="quantity-control">

                                <button
                                    class="qty-btn"
                                    onclick="changeQuantity('${product.id}', -1)"
                                    title="Kamaytirish"
                                >
                                    −
                                </button>


                                <input
                                    class="quantity-input"
                                    type="number"
                                    min="0"
                                    step="1"
                                    value="${quantity}"
                                    onchange="setQuantity('${product.id}', this)"
                                >


                                <button
                                    class="qty-btn"
                                    onclick="changeQuantity('${product.id}', 1)"
                                    title="Ko‘paytirish"
                                >
                                    +
                                </button>

                            </div>

                        </td>


                        <td>

                            <input
                                class="minimum-input"
                                type="number"
                                min="0"
                                step="1"
                                value="${lowLimit}"
                                onchange="setLowLimit('${product.id}', this)"
                            >

                        </td>


                        <td>

                            <span
                                class="status ${status.className}"
                            >
                                ${status.text}
                            </span>

                        </td>


                        <td>

                            <div class="actions">

                                <button
                                    class="edit-btn"
                                    onclick="openEdit('${product.id}')"
                                >
                                    TAHRIRLASH
                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteProduct('${product.id}')"
                                >
                                    O‘CHIRISH
                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }).join("");
    }


    /* =========================================
       STATISTIKA
    ========================================= */

    function updateStats() {

        const totalProducts =
            products.length;


        const totalQuantity =
            products.reduce(
                (sum, product) =>
                    sum +
                    (
                        Number(
                            product.quantity
                        ) || 0
                    ),
                0
            );


        const lowProducts =
            products.filter(
                product => {

                    const quantity =
                        Number(
                            product.quantity
                        ) || 0;


                    const lowLimit =
                        Number(
                            product.low_limit
                        ) || 0;


                    return (
                        quantity > 0 &&
                        quantity <= lowLimit
                    );
                }
            ).length;


        const outProducts =
            products.filter(
                product =>
                    Number(
                        product.quantity
                    ) === 0
            ).length;


        document.getElementById(
            "totalProducts"
        ).textContent =
            totalProducts;


        document.getElementById(
            "totalQuantity"
        ).textContent =
            totalQuantity;


        document.getElementById(
            "lowProducts"
        ).textContent =
            lowProducts;


        document.getElementById(
            "outProducts"
        ).textContent =
            outProducts;
    }


    /* =========================================
       OGOHLANTIRISH
    ========================================= */

    function renderStockNotifications() {

        const box =
            document.getElementById(
                "stockNotifications"
            );


        const warnings =
            products.filter(
                product => {

                    const quantity =
                        Number(
                            product.quantity
                        ) || 0;


                    const lowLimit =
                        Number(
                            product.low_limit
                        ) || 0;


                    return (
                        quantity === 0 ||
                        (
                            quantity > 0 &&
                            quantity <= lowLimit
                        )
                    );
                }
            );


        if (warnings.length === 0) {

            box.innerHTML = "";

            return;
        }


        box.innerHTML = `

            <div class="notifications">

                <div class="notification-title">
                    OGOHLANTIRISH
                </div>


                ${warnings.map(product => {

                    const quantity =
                        Number(
                            product.quantity
                        ) || 0;


                    const lowLimit =
                        Number(
                            product.low_limit
                        ) || 0;


                    const isOut =
                        quantity === 0;


                    return `

                        <div
                            class="
                                notification
                                ${
                                    isOut
                                        ? "notification-out"
                                        : "notification-low"
                                }
                            "
                        >

                            <strong>
                                ${escapeHTML(
                                    product.name
                                )}
                            </strong>


                            <span>

                                ${
                                    isOut
                                        ? "Mahsulot tugagan"
                                        : `Miqdor: ${quantity} / Minimal: ${lowLimit}`
                                }

                            </span>

                        </div>

                    `;

                }).join("")}

            </div>

        `;
    }


    /* =========================================
       SEARCH
    ========================================= */

    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "input",
            renderProducts
        );


    /* =========================================
       ENTER — QO'SHISH
    ========================================= */

    [
        "productName",
        "productQuantity",
        "productLowLimit"
    ]
    .forEach(id => {

        document
            .getElementById(id)
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {
                        addProduct();
                    }

                }
            );

    });


    /* =========================================
       MODAL
    ========================================= */

    document
        .getElementById(
            "editModal"
        )
        .addEventListener(
            "click",
            event => {

                if (
                    event.target.id ===
                    "editModal"
                ) {
                    closeEdit();
                }

            }
        );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {
                closeEdit();
            }

        }
    );


    /* =========================================
       AUTO REFRESH
    ========================================= */

    setInterval(
        loadProducts,
        5000
    );


    /* =========================================
       START
    ========================================= */

    loadProducts();

</script>

</body>
</html>
```
