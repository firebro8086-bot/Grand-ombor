const SUPABASE_URL =

const SUPABASE_KEY =
    "sb_publishable_yFGFSQb4K_gR-3KTqckJlQ_rF__5tfI";

const supabaseClient =

/* =========================================================
   STATE
   ========================================================= */

let products = [];

let selectedCategory = "";

let searchText = "";

let longPressTimer = null;

let notificationTimer = null;

let notificationCount = 0;

const stockStates = new Map();

let audioContext = null;


/* =========================================================
   AUDIO — MEMBRANE KEY
   ========================================================= */

function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return null;
        }

        audioContext =
            new AudioContext();
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext
            .resume()
            .catch(() => {});
    }


    return audioContext;
}


function playMembraneKey() {

    const ctx =
        getAudioContext();

    if (!ctx) {
        return;
    }


    const now =
        ctx.currentTime;

    const duration =
        0.055;


    const bufferSize =
        Math.floor(
            ctx.sampleRate *
            duration
        );


    const buffer =
        ctx.createBuffer(
            1,
            bufferSize,
            ctx.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        const t =
            i / bufferSize;

        const envelope =
            Math.pow(
                1 - t,
                3.2
            );

        data[i] =
            (
                Math.random() * 2 - 1
            ) *
            envelope;
    }


    const noise =
        ctx.createBufferSource();

    noise.buffer =
        buffer;


    const filter =
        ctx.createBiquadFilter();

    filter.type =
        "bandpass";

    filter.frequency.setValueAtTime(
        1750,
        now
    );

    filter.Q.setValueAtTime(
        1.1,
        now
    );


    const gain =
        ctx.createGain();

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.055,
        now + 0.002
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    noise.connect(filter);

    filter.connect(gain);

    gain.connect(
        ctx.destination
    );


    noise.start(now);

    noise.stop(
        now + duration
    );


    const thock =
        ctx.createOscillator();

    const thockGain =
        ctx.createGain();


    thock.type =
        "sine";


    thock.frequency.setValueAtTime(
        115,
        now
    );

    thock.frequency.exponentialRampToValueAtTime(
        78,
        now + 0.045
    );


    thockGain.gain.setValueAtTime(
        0.0001,
        now
    );

    thockGain.gain.exponentialRampToValueAtTime(
        0.025,
        now + 0.002
    );

    thockGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.05
    );


    thock.connect(
        thockGain
    );

    thockGain.connect(
        ctx.destination
    );


    thock.start(now);

    thock.stop(
        now + 0.055
    );
}


document.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                "button"
            );

        if (!button) {
            return;
        }

        if (
            button.dataset.noSound ===
            "true"
        ) {
            return;
        }

        playMembraneKey();
    },
    true
);


/* =========================================================
   HELPERS
   ========================================================= */

function numberValue(value) {

    const number =
        Number(value);

    if (
        !Number.isFinite(number)
    ) {
        return 0;
    }

    return Math.max(
        0,
        Math.floor(number)
    );
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function categoryLabel(name) {

    const value =
        String(name ?? "")
            .trim();

    const key =
        value.toLowerCase();


    const labels = {

        "rezinka":
            "REZINKALAR",

        "rezinkalar":
            "REZINKALAR",

        "механизм":
            "MEXANIZM",

        "mехanizm":
            "MEXANIZM",

        "mexanizm":
            "MEXANIZM",

        "profil":
            "PROFIL",

        "rels":
            "RELS",

        "petla":
            "PETLA"

    };


    return (
        labels[key] ||
        value.toUpperCase()
    );
}


/* =========================================================
   NOTIFICATIONS — STOCK ONLY
   ========================================================= */

function getStockState(product) {

    const quantity =
        Number(product.quantity) || 0;

    const low =
        Number(product.low_limit) || 0;


    if (quantity <= 0) {
        return "empty";
    }

    if (quantity <= low) {
        return "low";
    }

    return "ok";
}


function showStockNotification(
    product,
    state
) {

    const box =
        document.getElementById(
            "notification"
        );

    const title =
        document.getElementById(
            "notificationTitle"
        );

    const body =
        document.getElementById(
            "notificationBody"
        );

    const badge =
        document.getElementById(
            "notificationBadge"
        );


    if (
        !box ||
        !title ||
        !body
    ) {
        return;
    }


    const quantity =
        Number(product.quantity) || 0;


    if (state === "empty") {

        title.textContent =
            "TOVAR TUGADI";

        body.textContent =
            `${product.name} — qolmadi.`;

    } else if (
        state === "low"
    ) {

        title.textContent =
            "KAM QOLDI";

        body.textContent =
            `${product.name} — ${quantity} dona qoldi.`;

    } else {

        return;
    }


    box.dataset.type =
        state;


    notificationCount++;


    if (badge) {

        badge.textContent =
            notificationCount > 99
                ? "99+"
                : notificationCount;

        badge.classList.add(
            "show"
        );
    }


    box.classList.add(
        "open"
    );


    playMembraneKey();


    clearTimeout(
        notificationTimer
    );


    notificationTimer =
        setTimeout(
            () => {

                box.classList.remove(
                    "open"
                );

            },
            4500
        );
}


function checkStockTransition(
    product,
    forceNew = false
) {

    const id =
        product.id;

    const newState =
        getStockState(
            product
        );

    const oldState =
        stockStates.get(id);


    if (
        oldState === undefined &&
        forceNew
    ) {

        stockStates.set(
            id,
            newState
        );


        if (
            newState === "low" ||
            newState === "empty"
        ) {

            showStockNotification(
                product,
                newState
            );
        }

        return;
    }


    if (
        oldState === undefined
    ) {

        stockStates.set(
            id,
            newState
        );

        return;
    }


    stockStates.set(
        id,
        newState
    );


    if (
        oldState === "ok" &&
        newState === "low"
    ) {

        showStockNotification(
            product,
            "low"
        );
    }


    if (
        oldState === "ok" &&
        newState === "empty"
    ) {

        showStockNotification(
            product,
            "empty"
        );
    }


    if (
        oldState === "low" &&
        newState === "empty"
    ) {

        showStockNotification(
            product,
            "empty"
        );
    }
}


/*
    Umumiy bildirishnomalar o'chirilgan.
    Faqat xatolar console'da.
*/

function notify(
    message,
    type = "info"
) {

    if (
        type === "error"
    ) {

        console.error(
            "GRAND X:",
            message
        );
    }
}


/* =========================================================
   STATISTICS
   ========================================================= */

function updateStats() {

    const totalProducts =
        products.length;


    const totalQuantity =
        products.reduce(
            (sum, product) =>
                sum +
                numberValue(
                    product.quantity
                ),
            0
        );


    const low =
        products.filter(
            product =>
                numberValue(
                    product.quantity
                ) > 0 &&
                numberValue(
                    product.quantity
                ) <=
                numberValue(
                    product.low_limit
                )
        ).length;


    const empty =
        products.filter(
            product =>
                numberValue(
                    product.quantity
                ) <= 0
        ).length;


    document.getElementById(
        "totalProducts"
    ).textContent =
        totalProducts;


    document.getElementById(
        "totalQuantity"
    ).textContent =
        totalQuantity;


    document.getElementById(
        "lowStock"
    ).textContent =
        low;


    document.getElementById(
        "emptyStock"
    ).textContent =
        empty;
}


/* =========================================================
   CATEGORIES — LOAD
   ========================================================= */

async function loadCategories() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("categories")
            .select(
                "id,name,created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    categories =
        data || [];


    renderCategories();

    updateCategorySelects();
}


/* =========================================================
   CATEGORIES — RENDER
   ========================================================= */

function renderCategories() {

    const container =
        document.getElementById(
            "categoryButtons"
        );


    container.innerHTML = "";


    const allButton =
        document.createElement(
            "button"
        );

    allButton.type =
        "button";

    allButton.className =
        "category-button" +
        (
            selectedCategory === ""
                ? " active"
                : ""
        );

    allButton.dataset.category =
        "";

    allButton.textContent =
        "BARCHASI";


    allButton.addEventListener(
        "click",
        () => {

            selectedCategory =
                "";

            renderCategories();
            renderProducts();
        }
    );


    container.appendChild(
        allButton
    );


    categories.forEach(
        category => {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.style.display =
                "inline-flex";

            wrapper.style.alignItems =
                "center";


            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "category-button" +
                (
                    selectedCategory ===
                    category.name
                        ? " active"
                        : ""
                );

            button.dataset.category =
                category.name;

            button.textContent =
                categoryLabel(
                    category.name
                );


            button.addEventListener(
                "click",
                () => {

                    selectedCategory =
                        category.name;

                    renderCategories();
                    renderProducts();
                }
            );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.type =
                "button";

            deleteButton.className =
                "category-delete";

            deleteButton.dataset.noSound =
                "true";

            deleteButton.textContent =
                "×";

            deleteButton.title =
                "Kategoriyani o‘chirish";


            deleteButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    deleteCategory(
                        category.id,
                        category.name
                    );
                }
            );


            wrapper.appendChild(
                button
            );

            wrapper.appendChild(
                deleteButton
            );


            container.appendChild(
                wrapper
            );
        }
    );
}


/* =========================================================
   CATEGORY SELECTS
   ========================================================= */

function updateCategorySelects() {

    const selects = [

        document.getElementById(
            "productCategory"
        ),

        document.getElementById(
            "editCategory"
        ),

        document.getElementById(
            "bulkCategory"
        )

    ];


    selects.forEach(
        select => {

            if (!select) {
                return;
            }


            const current =
                select.value;


            if (
                select.id ===
                "bulkCategory"
            ) {

                select.innerHTML = `
                    <option value="">
                        Kategoriyaga o'tkazish
                    </option>
                `;

            } else {

                select.innerHTML = `
                    <option value="">
                        ${
                            select.id ===
                            "productCategory"
                                ? "Kategoriyani tanlang"
                                : "Kategoriyasiz"
                        }
                    </option>
                `;
            }


            categories.forEach(
                category => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        category.name;

                    option.textContent =
                        categoryLabel(
                            category.name
                        );

                    select.appendChild(
                        option
                    );
                }
            );


            if (
                categories.some(
                    category =>
                        category.name ===
                        current
                )
            ) {

                select.value =
                    current;
            }
        }
    );
}


/* =========================================================
   ADD CATEGORY
   ========================================================= */

async function addCategory() {

    const input =
        document.getElementById(
            "categoryInput"
        );


    const name =
        input.value.trim();


    if (!name) {
        return;
    }


    const exists =
        categories.some(
            category =>
                category.name
                    .toLowerCase() ===
                name.toLowerCase()
        );


    if (exists) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("categories")
            .insert({
                name
            })
            .select()
            .single();


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    categories.push(
        data
    );


    input.value = "";


    renderCategories();

    updateCategorySelects();
}


/* =========================================================
   DELETE CATEGORY
   ========================================================= */

async function deleteCategory(
    id,
    name
) {

    const confirmed =
        window.confirm(
            `Kategoriyani o‘chirish: ${categoryLabel(name)}?`
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("categories")
            .delete()
            .eq("id", id);


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    /*
       Kategoriyani mahsulotlardan ham
       olib tashlaymiz.
    */

    await supabaseClient
        .from("products")
        .update({
            category: null
        })
        .eq(
            "category",
            name
        );


    if (
        selectedCategory === name
    ) {

        selectedCategory =
            "";
    }


    await loadCategories();
    await loadProducts();
}


/* =========================================================
   PRODUCTS — LOAD
   ========================================================= */

async function loadProducts() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select(
                "id,created_at,name,quantity,low_limit,image,category"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    products =
        (data || []).map(
            product => ({
                ...product,

                quantity:
                    numberValue(
                        product.quantity
                    ),

                low_limit:
                    numberValue(
                        product.low_limit
                    )
            })
        );


    /*
       Initial load:
       holatni eslab qolamiz,
       lekin eski low/empty mahsulotlarga
       bildirishnoma bermaymiz.
    */

    products.forEach(
        product =>
            checkStockTransition(
                product
            )
    );


    /*
       O'chirilgan mahsulotlarning
       eski holatini tozalaymiz.
    */

    const currentIds =
        new Set(
            products.map(
                product =>
                    product.id
            )
        );


    for (
        const id of stockStates.keys()
    ) {

        if (
            !currentIds.has(id)
        ) {

            stockStates.delete(
                id
            );
        }
    }


    updateStats();

    renderProducts();
}


/* =========================================================
   PRODUCT FILTER
   ========================================================= */

function getFilteredProducts() {

    const query =
        searchText
            .trim()
            .toLowerCase();


    return products.filter(
        product => {

            const matchesSearch =
                !query ||
                String(
                    product.name || ""
                )
                    .toLowerCase()
                    .includes(query);


            const matchesCategory =
                !selectedCategory ||
                product.category ===
                    selectedCategory;


            return (
                matchesSearch &&
                matchesCategory
            );
        }
    );
}


/* =========================================================
   PRODUCT RENDER
   ========================================================= */

function renderProducts() {

    const body =
        document.getElementById(
            "productsBody"
        );


    const filtered =
        getFilteredProducts();


    body.innerHTML = "";


    if (!filtered.length) {

        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `
            <td colspan="6"
                style="
                    text-align:center;
                    color:#999;
                    padding:28px;
                "
            >
                MAHSULOT TOPILMADI
            </td>
        `;


        body.appendChild(
            row
        );

        updateSelectionUI();

        return;
    }


    filtered.forEach(
        product => {

            const row =
                document.createElement(
                    "tr"
                );


            if (
                selectedProducts.has(
                    product.id
                )
            ) {

                row.classList.add(
                    "selected"
                );
            }


            const quantity =
                numberValue(
                    product.quantity
                );

            const low =
                numberValue(
                    product.low_limit
                );


            let statusClass =
                "status-ok";

            let statusText =
                "YETARLI";


            if (
                quantity <= 0
            ) {

                statusClass =
                    "status-out";

                statusText =
                    "TUGAGAN";

            } else if (
                quantity <= low
            ) {

                statusClass =
                    "status-low";

                statusText =
                    "KAM QOLDI";
            }


            row.innerHTML = `

                <td>

                    <div class="product-name">
                        ${escapeHtml(product.name)}
                    </div>

                </td>


                <td>

                    <div class="product-category">
                        ${
                            product.category
                                ? escapeHtml(
                                    categoryLabel(
                                        product.category
                                    )
                                )
                                : "—"
                        }
                    </div>

                </td>


                <td>

                    <div class="quantity-control">

                        <button
                            type="button"
                            class="quantity-minus"
                            data-id="${product.id}"
                            aria-label="Kamaytirish"
                        >
                            −
                        </button>


                        <span
                            class="quantity-value"
                        >
                            ${quantity}
                        </span>


                        <button
                            type="button"
                            class="quantity-plus"
                            data-id="${product.id}"
                            aria-label="Ko‘paytirish"
                        >
                            +
                        </button>

                    </div>

                </td>


                <td>

                    <input
                        type="number"
                        class="low-limit-input"
                        data-id="${product.id}"
                        value="${low}"
                        min="0"
                        step="1"
                        aria-label="Minimal miqdor"
                    >

                </td>


                <td>

                    <span
                        class="status ${statusClass}"
                    >
                        ${statusText}
                    </span>

                </td>


                <td>

                    <div class="actions">

                        <button
                            type="button"
                            class="edit-button"
                            data-id="${product.id}"
                            title="Tahrirlash"
                        >
                            ✎
                        </button>


                        <button
                            type="button"
                            class="delete-button"
                            data-id="${product.id}"
                            title="O‘chirish"
                        >
                            ×
                        </button>

                    </div>

                </td>

            `;


            /*
               Long press
            */

            row.addEventListener(
                "pointerdown",
                event => {

                    if (
                        event.target.closest(
                            "button,input,select"
                        )
                    ) {
                        return;
                    }


                    if (!selectionMode) {

                        longPressTimer =
                            setTimeout(
                                () => {

                                    selectionMode =
                                        true;

                                    toggleProductSelection(
                                        product.id
                                    );

                                    updateSelectionUI();

                                },
                                2000
                            );
                    }
                }
            );


            row.addEventListener(
                "pointerup",
                () => {

                    clearTimeout(
                        longPressTimer
                    );
                }
            );


            row.addEventListener(
                "pointerleave",
                () => {

                    clearTimeout(
                        longPressTimer
                    );
                }
            );


            row.addEventListener(
                "click",
                event => {

                    if (
                        !selectionMode
                    ) {
                        return;
                    }


                    if (
                        event.target.closest(
                            "button,input,select"
                        )
                    ) {
                        return;
                    }


                    toggleProductSelection(
                        product.id
                    );

                    renderProducts();
                }
            );


            body.appendChild(
                row
            );
        }
    );


    /*
       Buttons
    */

    body.querySelectorAll(
        ".quantity-plus"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const id =
                        button.dataset.id;

                    const product =
                        products.find(
                            item =>
                                item.id === id
                        );

                    if (!product) {
                        return;
                    }


                    setQuantity(
                        id,
                        numberValue(
                            product.quantity
                        ) + 1
                    );
                }
            );
        }
    );


    body.querySelectorAll(
        ".quantity-minus"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const id =
                        button.dataset.id;

                    const product =
                        products.find(
                            item =>
                                item.id === id
                        );

                    if (!product) {
                        return;
                    }


                    setQuantity(
                        id,
                        Math.max(
                            0,
                            numberValue(
                                product.quantity
                            ) - 1
                        )
                    );
                }
            );
        }
    );


    body.querySelectorAll(
        ".low-limit-input"
    ).forEach(
        input => {

            input.addEventListener(
                "change",
                () => {

                    setLowLimit(
                        input.dataset.id,
                        numberValue(
                            input.value
                        )
                    );
                }
            );
        }
    );


    body.querySelectorAll(
        ".edit-button"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    openEdit(
                        button.dataset.id
                    );
                }
            );
        }
    );


    body.querySelectorAll(
        ".delete-button"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    deleteProduct(
                        button.dataset.id
                    );
                }
            );
        }
    );


    updateSelectionUI();
}


/* =========================================================
   SET QUANTITY
   ========================================================= */

async function setQuantity(
    id,
    quantity
) {

    quantity =
        numberValue(
            quantity
        );


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .update({
                quantity
            })
            .eq(
                "id",
                id
            );


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    const oldProduct =
        products.find(
            product =>
                product.id === id
        );


    if (oldProduct) {

        const updatedProduct = {
            ...oldProduct,
            quantity
        };


        products =
            products.map(
                product =>
                    product.id === id
                        ? updatedProduct
                        : product
            );


        checkStockTransition(
            updatedProduct
        );
    }


    updateStats();

    renderProducts();
}


/* =========================================================
   SET LOW LIMIT
   ========================================================= */

async function setLowLimit(
    id,
    low
) {

    low =
        numberValue(
            low
        );


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .update({
                low_limit: low
            })
            .eq(
                "id",
                id
            );


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    const oldProduct =
        products.find(
            product =>
                product.id === id
        );


    if (oldProduct) {

        const updatedProduct = {
            ...oldProduct,
            low_limit: low
        };


        products =
            products.map(
                product =>
                    product.id === id
                        ? updatedProduct
                        : product
            );


        checkStockTransition(
            updatedProduct
        );
    }


    updateStats();

    renderProducts();
}


/* =========================================================
   ADD PRODUCT
   ========================================================= */

async function addProduct() {

    const nameInput =
        document.getElementById(
            "productName"
        );

    const quantityInput =
        document.getElementById(
            "productQuantity"
        );

    const lowInput =
        document.getElementById(
            "productLowLimit"
        );

    const categoryInput =
        document.getElementById(
            "productCategory"
        );


    const name =
        nameInput.value.trim();


    if (!name) {
        return;
    }


    const quantity =
        numberValue(
            quantityInput.value
        );


    const low =
        numberValue(
            lowInput.value || 5
        );


    const category =
        categoryInput.value ||
        null;


    const data = {

        name,

        quantity,

        low_limit:
            low || 5,

        category,

        image: null
    };


    const {
        data: inserted,
        error
    } =
        await supabaseClient
            .from("products")
            .insert(data)
            .select()
            .single();


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    const addedProduct = {

        ...inserted,

        quantity:
            numberValue(
                inserted.quantity
            ),

        low_limit:
            numberValue(
                inserted.low_limit
            )
    };


    products.push(
        addedProduct
    );


    nameInput.value = "";

    quantityInput.value = "";

    lowInput.value = "5";

    categoryInput.value = "";


    checkStockTransition(
        addedProduct,
        true
    );


    updateStats();

    renderProducts();
}


/* =========================================================
   DELETE PRODUCT
   ========================================================= */

async function deleteProduct(
    id
) {

    const product =
        products.find(
            item =>
                item.id === id
        );


    if (!product) {
        return;
    }


    const confirmed =
        window.confirm(
            `Mahsulotni o‘chirish: ${product.name}?`
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    stockStates.delete(
        id
    );


    products =
        products.filter(
            item =>
                item.id !== id
        );


    selectedProducts.delete(
        id
    );


    updateStats();

    renderProducts();

    updateSelectionUI();
}


/* =========================================================
   EDIT PRODUCT
   ========================================================= */

function openEdit(id) {

    const product =
        products.find(
            item =>
                item.id === id
        );


    if (!product) {
        return;
    }


    document.getElementById(
        "editId"
    ).value = id;


    document.getElementById(
        "editName"
    ).value =
        product.name || "";


    document.getElementById(
        "editQuantity"
    ).value =
        numberValue(
            product.quantity
        );


    document.getElementById(
        "editLowLimit"
    ).value =
        numberValue(
            product.low_limit
        );


    document.getElementById(
        "editCategory"
    ).value =
        product.category || "";


    const modal =
        document.getElementById(
            "editModal"
        );


    modal.style.display =
        "flex";

    modal.setAttribute(
        "aria-hidden",
        "false"
    );
}


function closeEdit() {

    const modal =
        document.getElementById(
            "editModal"
        );


    modal.style.display =
        "none";

    modal.setAttribute(
        "aria-hidden",
        "true"
    );
}


/* =========================================================
   SAVE EDIT
   ========================================================= */

async function saveEdit() {

    const id =
        document.getElementById(
            "editId"
        ).value;


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    if (!name) {
        return;
    }


    const quantity =
        numberValue(
            document.getElementById(
                "editQuantity"
            ).value
        );


    const low =
        numberValue(
            document.getElementById(
                "editLowLimit"
            ).value
        );


    const category =
        document.getElementById(
            "editCategory"
        ).value ||
        null;


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .update({

                name,

                quantity,

                low_limit:
                    low,

                category

            })
            .eq(
                "id",
                id
            );


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    const oldProduct =
        products.find(
            product =>
                product.id === id
        );


    if (oldProduct) {

        const updatedProduct = {

            ...oldProduct,

            name,

            quantity,

            low_limit:
                low,

            category
        };


        products =
            products.map(
                product =>
                    product.id === id
                        ? updatedProduct
                        : product
            );


        checkStockTransition(
            updatedProduct
        );
    }


    closeEdit();

    updateStats();

    renderProducts();
}


/* =========================================================
   SELECTION
   ========================================================= */

function toggleProductSelection(
    id
) {

    if (
        selectedProducts.has(id)
    ) {

        selectedProducts.delete(
            id
        );

    } else {

        selectedProducts.add(
            id
        );
    }
}


function updateSelectionUI() {

    const bulk =
        document.getElementById(
            "bulkActions"
        );

    const count =
        document.getElementById(
            "selectedCount"
        );

    const hint =
        document.getElementById(
            "selectionHint"
        );


    if (
        !selectionMode
    ) {

        bulk.style.display =
            "none";

        count.textContent =
            "0 ta tanlandi";

        hint.textContent =
            "";

        return;
    }


    bulk.style.display =
        "flex";


    count.textContent =
        `${selectedProducts.size} ta tanlandi`;


    hint.textContent =
        "Tanlash rejimi: mahsulot ustiga bosing";
}


/* =========================================================
   EXIT SELECTION
   ========================================================= */

function exitSelectionMode() {

    selectionMode =
        false;

    selectedProducts.clear();

    updateSelectionUI();

    renderProducts();
}


/* =========================================================
   BULK MOVE
   ========================================================= */

async function bulkMove() {

    const category =
        document.getElementById(
            "bulkCategory"
        ).value;


    if (
        !category ||
        !selectedProducts.size
    ) {
        return;
    }


    const ids =
        Array.from(
            selectedProducts
        );


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .update({
                category
            })
            .in(
                "id",
                ids
            );


    if (error) {

        notify(
            error.message,
            "error"
        );

        return;
    }


    products =
        products.map(
            product =>
                selectedProducts.has(
                    product.id
                )
                    ? {
                        ...product,
                        category
                    }
                    : product
        );


    exitSelectionMode();
}


/* =========================================================
   SEARCH
   ========================================================= */

function handleSearch() {

    searchText =
        document.getElementById(
            "searchInput"
        ).value;


    renderProducts();
}


/* =========================================================
   NOTIFICATION BELL
   ========================================================= */

function toggleNotifications() {

    const box =
        document.getElementById(
            "notification"
        );


    box.classList.toggle(
        "open"
    );


    if (
        box.classList.contains(
            "open"
        )
    ) {

        notificationCount =
            0;


        const badge =
            document.getElementById(
                "notificationBadge"
            );


        badge.textContent =
            "0";


        badge.classList.remove(
            "show"
        );
    }
}


/* =========================================================
   SCROLL SHINE
   ========================================================= */

let scrollTimer = null;


window.addEventListener(
    "scroll",
    () => {

        document.body.classList.add(
            "is-scrolling"
        );


        clearTimeout(
            scrollTimer
        );


        scrollTimer =
            setTimeout(
                () => {

                    document.body.classList.remove(
                        "is-scrolling"
                    );

                },
                650
            );

    },
    {
        passive: true
    }
);


/* =========================================================
   EVENTS
   ========================================================= */

document
    .getElementById(
        "addCategoryButton"
    )
    .addEventListener(
        "click",
        addCategory
    );


document
    .getElementById(
        "categoryInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                addCategory();
            }
        }
    );


document
    .getElementById(
        "addProductButton"
    )
    .addEventListener(
        "click",
        addProduct
    );


document
    .getElementById(
        "productName"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                addProduct();
            }
        }
    );


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        handleSearch
    );


document
    .getElementById(
        "saveEditButton"
    )
    .addEventListener(
        "click",
        saveEdit
    );


document
    .getElementById(
        "cancelEditButton"
    )
    .addEventListener(
        "click",
        closeEdit
    );


document
    .getElementById(
        "notificationBell"
    )
    .addEventListener(
        "click",
        toggleNotifications
    );


document
    .getElementById(
        "notificationClose"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "notification"
                )
                .classList.remove(
                    "open"
                );
        }
    );


document
    .getElementById(
        "bulkMoveButton"
    )
    .addEventListener(
        "click",
        bulkMove
    );


document
    .getElementById(
        "bulkCancelButton"
    )
    .addEventListener(
        "click",
        exitSelectionMode
    );


document
    .getElementById(
        "editModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "editModal"
            ) {

                closeEdit();
            }
        }
    );


/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeEdit();

            if (
                selectionMode
            ) {

                exitSelectionMode();
            }
        }
    }
);


/* =========================================================
   START APP
   ========================================================= */

async function startApp() {

    await loadCategories();

    await loadProducts();


    /*
       Товары обновляем каждые 7 секунд.
       Существующий stockStates не сбрасывается,
       поэтому повторных уведомлений нет.
    */

    setInterval(
        async () => {

            await loadProducts();

        },
        7000
    );


    /*
       Категории обновляем реже.
    */

    setInterval(
        async () => {

            await loadCategories();

        },
        15000
    );
}


startApp();

</script>
