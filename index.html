<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAND X — Ombor</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">GRAND <span>X</span></div>
    <div class="header-text">OMBOR BOSHQARUV TIZIMI</div>
</header>

<main class="container">

    <section class="stats">

        <div class="stat-card">
            <div class="stat-title">MAHSULOTLAR</div>
            <div class="stat-number" id="productCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">JAMI MIQDOR</div>
            <div class="stat-number" id="totalStock">0</div>
        </div>

        <div class="stat-card danger-card">
            <div class="stat-title">KAM QOLGAN</div>
            <div class="stat-number" id="lowStock">0</div>
        </div>

    </section>


    <section class="panel">

        <div class="panel-title">
            <h2>Mahsulot qo‘shish</h2>
            <p>Yangi mahsulotni omborga qo‘shing</p>
        </div>

        <div class="form">

            <div class="form-group">
                <label>Mahsulot nomi</label>
                <input id="productName" type="text"
                       placeholder="Masalan: Telefon g‘ilofi">
            </div>

            <div class="form-group">
                <label>Mahsulot rasmi</label>
                <input id="productImage" type="file"
                       accept="image/*">
            </div>

            <div class="form-group">
                <label>Miqdori</label>
                <input id="productQuantity" type="number"
                       min="0" placeholder="100">
            </div>

            <div class="form-group">
                <label>Minimal miqdor</label>
                <input id="lowLimit" type="number"
                       min="0" value="5">
            </div>

            <button class="primary-btn" onclick="addProduct()">
                + MAHSULOT QO‘SHISH
            </button>

        </div>

    </section>


    <section class="panel">

        <div class="panel-title">
            <h2>Qidirish</h2>
            <p>Mahsulot nomi orqali qidiring</p>
        </div>

        <div class="search-box">
            <input id="search"
                   type="text"
                   placeholder="Mahsulot nomini yozing..."
                   oninput="renderProducts()">
        </div>

    </section>


    <div id="warning" class="warning"></div>


    <section class="panel">

        <div class="panel-title">
            <h2>Ombor</h2>
            <p>Barcha mahsulotlar</p>
        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>MAHSULOT</th>
                        <th>MIQDORI</th>
                        <th>MINIMAL</th>
                        <th>HOLATI</th>
                        <th>AMALLAR</th>
                    </tr>
                </thead>

                <tbody id="productTable"></tbody>

            </table>

        </div>

    </section>

</main>


<!-- MODAL REقلDAKTIRASH -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Mahsulotni tahrirlash</h3>
            <span class="close-btn" onclick="closeEditModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editProductId">

            <div class="form-group">
                <label>Mahsulot nomi</label>
                <input id="editProductName" type="text">
            </div>

            <div class="form-group">
                <label>Yangi rasm (ixtiyoriy)</label>
                <input id="editProductImage" type="file" accept="image/*">
            </div>

            <div class="form-group">
                <label>Miqdori</label>
                <input id="editProductQuantity" type="number" min="0">
            </div>

            <div class="form-group">
                <label>Minimal miqdor</label>
                <input id="editLowLimit" type="number" min="0">
            </div>

            <div class="modal-actions">
                <button class="secondary-btn" onclick="closeEditModal()">Bekor qilish</button>
                <button class="primary-btn" onclick="saveEditedProduct()">Saqlash</button>
            </div>
        </div>
    </div>
</div>


<script>

let products =
    JSON.parse(localStorage.getItem("grandXProducts")) || [];


// RASM
function imageToBase64(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}


// MAHSULOT QO'SHISH
async function addProduct() {

    const name =
        document.getElementById("productName").value.trim();

    const quantity =
        Number(document.getElementById("productQuantity").value);

    const lowLimit =
        Number(document.getElementById("lowLimit").value);

    const imageFile =
        document.getElementById("productImage").files[0];


    if (!name) {
        alert("Mahsulot nomini kiriting!");
        return;
    }

    if (isNaN(quantity) || quantity < 0) {
        alert("Miqdorni to‘g‘ri kiriting!");
        return;
    }

    if (!imageFile) {
        alert("Mahsulot rasmini tanlang!");
        return;
    }

    if (isNaN(lowLimit) || lowLimit < 0) {
        alert("Minimal miqdorni to‘g‘ri kiriting!");
        return;
    }


    const image =
        await imageToBase64(imageFile);


    products.push({

        id: Date.now(),

        name: name,

        quantity: quantity,

        lowLimit: lowLimit,

        image: image

    });


    saveProducts();

    clearForm();

    renderProducts();

}


// SAQLASH
function saveProducts() {

    localStorage.setItem(
        "grandXProducts",
        JSON.stringify(products)
    );

}


// FORM TOZALASH
function clearForm() {

    document.getElementById("productName").value = "";

    document.getElementById("productQuantity").value = "";

    document.getElementById("lowLimit").value = "5";

    document.getElementById("productImage").value = "";

}


// HOLAT
function getStatus(product) {

    if (product.quantity === 0) {

        return `<span class="status out">TUGADI</span>`;

    }

    if (product.quantity <= product.lowLimit) {

        return `<span class="status low">KAM QOLDI</span>`;

    }

    return `<span class="status ok">YETARLI</span>`;

}


// MAHSULOTLAR
function renderProducts() {

    const table =
        document.getElementById("productTable");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        products.filter(product =>
            product.name
            .toLowerCase()
            .includes(search)
        );


    if (filtered.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Mahsulot topilmadi
                </td>
            </tr>
        `;

    } else {

        table.innerHTML = filtered.map(product => `

            <tr>

                <td>
                    <strong>
                        ${escapeHTML(product.name)}
                    </strong>
                </td>


                <td>

                    <span class="quantity ${
                        product.quantity === 0
                        ? "out-text"
                        : product.quantity <= product.lowLimit
                        ? "low-text"
                        : ""
                    }">
                        ${product.quantity}
                    </span>

                </td>


                <td>
                    ${product.lowLimit}
                </td>


                <td>
                    ${getStatus(product)}
                </td>


                <td>

                    <div class="actions">

                        <button
                            class="action-btn"
                            onclick="changeQuantity(${product.id}, -1)">
                            −
                        </button>


                        <button
                            class="action-btn"
                            onclick="changeQuantity(${product.id}, 1)">
                            +
                        </button>


                        <input
                            class="quantity-input"
                            id="input-${product.id}"
                            type="number"
                            min="0"
                            placeholder="Son"
                        >


                        <button
                            class="action-btn"
                            onclick="changeByInput(${product.id}, -1)">
                            − SON
                        </button>


                        <button
                            class="action-btn"
                            onclick="changeByInput(${product.id}, 1)">
                            + SON
                        </button>

                        <button
                            class="action-btn edit-btn"
                            onclick="openEditModal(${product.id})">
                            TAHRIRLASH
                        </button>

                        <button
                            class="action-btn delete-btn"
                            onclick="deleteProduct(${product.id})">
                            O‘CHIRISH
                        </button>

                    </div>

                </td>

            </tr>

        `).join("");

    }


    updateStats();

    showWarnings();

}


// ODDIY + / -
function changeQuantity(id, amount) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    product.quantity += amount;


    if (product.quantity < 0) {
        product.quantity = 0;
    }


    saveProducts();

    renderProducts();

}


// KIRITILGAN SON
function changeByInput(id, operation) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    const input =
        document.getElementById(`input-${id}`);


    const amount =
        Number(input.value);


    if (isNaN(amount) || amount <= 0) {

        alert("Avval son kiriting!");

        input.focus();

        return;
    }


    if (operation === 1) {

        product.quantity += amount;

    }


    if (operation === -1) {

        product.quantity -= amount;

    }


    if (product.quantity < 0) {

        product.quantity = 0;

    }


    input.value = "";

    saveProducts();

    renderProducts();

}


// TAHRIRLASH MODALINI OCHISH
function openEditModal(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;

    document.getElementById("editProductId").value = product.id;
    document.getElementById("editProductName").value = product.name;
    document.getElementById("editProductQuantity").value = product.quantity;
    document.getElementById("editLowLimit").value = product.lowLimit;
    document.getElementById("editProductImage").value = "";

    document.getElementById("editModal").style.display = "flex";
}

// MODALNI YOPISH
function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
}

// TAHRIRLANGAN MAHSULOTNI SAQLASH
async function saveEditedProduct() {
    const id = Number(document.getElementById("editProductId").value);
    const product = products.find(p => p.id === id);

    if (!product) return;

    const newName = document.getElementById("editProductName").value.trim();
    const newQuantity = Number(document.getElementById("editProductQuantity").value);
    const newLowLimit = Number(document.getElementById("editLowLimit").value);
    const imageFile = document.getElementById("editProductImage").files[0];

    if (!newName) {
        alert("Mahsulot nomini kiriting!");
        return;
    }

    if (isNaN(newQuantity) || newQuantity < 0) {
        alert("Miqdorni to‘g‘ri kiriting!");
        return;
    }

    if (isNaN(newLowLimit) || newLowLimit < 0) {
        alert("Minimal miqdorni to‘g‘ri kiriting!");
        return;
    }

    product.name = newName;
    product.quantity = newQuantity;
    product.lowLimit = newLowLimit;

    if (imageFile) {
        product.image = await imageToBase64(imageFile);
    }

    saveProducts();
    closeEditModal();
    renderProducts();
}


// O'CHIRISH
function deleteProduct(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    if (!confirm(
        `"${product.name}" mahsulotini o‘chirmoqchimisiz?`
    )) return;


    products =
        products.filter(p => p.id !== id);


    saveProducts();

    renderProducts();

}


// STATISTIKA
function updateStats() {

    document.getElementById("productCount")
        .textContent = products.length;


    const total =
        products.reduce(
            (sum, product) =>
                sum + product.quantity,
            0
        );


    document.getElementById("totalStock")
        .textContent = total;


    const low =
        products.filter(
            product =>
                product.quantity <= product.lowLimit
        ).length;


    document.getElementById("lowStock")
        .textContent = low;

}


// OGOHLANTIRISH
function showWarnings() {

    const warning =
        document.getElementById("warning");


    const lowProducts =
        products.filter(
            product =>
                product.quantity <= product.lowLimit
        );


    if (lowProducts.length === 0) {

        warning.style.display = "none";

        return;

    }


    warning.style.display = "block";


    warning.innerHTML =
        "⚠️ <strong>DIQQAT!</strong> " +

        lowProducts
        .map(product =>
            `${escapeHTML(product.name)} — ${product.quantity} dona qoldi`
        )
        .join(" &nbsp; | &nbsp; ");

}


// XAVFSIZ TEXT
function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


renderProducts();

</script>

</body>
</html>
