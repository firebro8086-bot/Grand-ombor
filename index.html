```html
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAND X — Ombor</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">
    <div>
        <h1>GRAND X</h1>
        <p>OMBOR BOSHQARUV TIZIMI</p>
    </div>
</header>

<main class="container">

    <!-- STATISTIKA -->
    <section class="stats">

        <div class="stat-card">
            <span>MAHSULOTLAR</span>
            <strong id="totalProducts">0</strong>
        </div>

        <div class="stat-card">
            <span>JAMI MIQDOR</span>
            <strong id="totalQuantity">0</strong>
        </div>

        <div class="stat-card warning-card">
            <span>KAM QOLGAN</span>
            <strong id="lowProducts">0</strong>
        </div>

        <div class="stat-card danger-card">
            <span>TUGAGAN</span>
            <strong id="outProducts">0</strong>
        </div>

    </section>

    <!-- QO'SHISH -->
    <section class="panel">

        <div class="panel-title">
            <h2>YANGI MAHSULOT</h2>
        </div>

        <div class="add-form">

            <input
                type="text"
                id="productName"
                placeholder="Mahsulot nomi"
                autocomplete="off"
            >

            <input
                type="number"
                id="productQuantity"
                placeholder="Miqdori"
                min="0"
                step="1"
            >

            <input
                type="number"
                id="productLowLimit"
                placeholder="Minimal miqdor"
                min="0"
                step="1"
            >

            <button class="main-btn" onclick="addProduct()">
                QO‘SHISH
            </button>

        </div>

        <div id="message"></div>

    </section>

    <!-- QIDIRUV -->
    <section class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Mahsulot qidirish..."
            autocomplete="off"
        >

    </section>

    <!-- OGOHLANTIRISH -->
    <section id="stockNotifications"></section>

    <!-- MAHSULOTLAR -->
    <section class="panel table-panel">

        <div class="panel-title">
            <h2>MAHSULOTLAR</h2>
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>MAHSULOT</th>
                        <th>MIQDOR</th>
                        <th>MINIMAL</th>
                        <th>HOLAT</th>
                        <th>AMALLAR</th>
                    </tr>
                </thead>

                <tbody id="productsTable">
                </tbody>

            </table>

        </div>

    </section>

</main>


<!-- TAHRIRLASH MODALI -->

<div id="editModal" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">
            <h2>MAHSULOTNI TAHRIRLASH</h2>

            <button
                class="modal-close"
                onclick="closeEdit()"
            >
                ×
            </button>
        </div>

        <input
            type="text"
            id="editName"
            placeholder="Mahsulot nomi"
        >

        <input
            type="number"
            id="editQuantity"
            placeholder="Miqdori"
            min="0"
            step="1"
        >

        <input
            type="number"
            id="editLowLimit"
            placeholder="Minimal miqdor"
            min="0"
            step="1"
        >

        <div class="modal-buttons">

            <button
                class="save-btn"
                onclick="saveEdit()"
            >
                SAQLASH
            </button>

            <button
                class="cancel-btn"
                onclick="closeEdit()"
            >
                BEKOR QILISH
            </button>

        </div>

    </div>

</div>


<script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        "https://szgtlkykyfacjliisigf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_yFGFSQb4K_gR-3KTqckJlQ_rF__5tfI";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let products = [];
    let editingId = null;


    /* =========================
       XAVFSIZ HTML
    ========================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    /* =========================
       MAHSULOTLARNI YUKLASH
    ========================= */

    async function loadProducts() {

        const { data, error } = await supabaseClient
            .from("products")
            .select(
                "id, created_at, name, quantity, low_limit, image"
            )
            .order("created_at", {
                ascending: false
            });

        if (error) {

            console.error(error);

            showMessage(
                "Ma'lumotlarni yuklashda xatolik.",
                "error"
            );

            return;
        }

        products = data || [];

        renderProducts();
        updateStats();
        renderStockNotifications();
    }


    /* =========================
       MAHSULOT QO'SHISH
    ========================= */

    async function addProduct() {

        const nameInput =
            document.getElementById("productName");

        const quantityInput =
            document.getElementById("productQuantity");

        const lowLimitInput =
            document.getElementById("productLowLimit");


        const name =
            nameInput.value.trim();

        const quantity =
            parseInt(quantityInput.value, 10);

        const lowLimit =
            parseInt(lowLimitInput.value, 10);


        if (!name) {

            showMessage(
                "Mahsulot nomini kiriting.",
                "error"
            );

            return;
        }


        if (
            Number.isNaN(quantity) ||
            quantity < 0
        ) {

            showMessage(
                "Miqdorni to‘g‘ri kiriting.",
                "error"
            );

            return;
        }


        if (
            Number.isNaN(lowLimit) ||
            lowLimit < 0
        ) {

            showMessage(
                "Minimal miqdorni to‘g‘ri kiriting.",
                "error"
            );

            return;
        }


        const { error } = await supabaseClient
            .from("products")
            .insert({
                name: name,
                quantity: quantity,
                low_limit: lowLimit,
                image: null
            });


        if (error) {

            console.error(error);

            showMessage(
                "Mahsulot qo‘shilmadi.",
                "error"
            );

            return;
        }


        nameInput.value = "";
        quantityInput.value = "";
        lowLimitInput.value = "";


        showMessage(
            "Mahsulot muvaffaqiyatli qo‘shildi.",
            "success"
        );


        await loadProducts();
    }


    /* =========================
       MIQDORNI O'ZGARTIRISH
    ========================= */

    async function updateQuantity(id, quantity) {

        quantity = parseInt(quantity, 10);


        if (
            Number.isNaN(quantity) ||
            quantity < 0
        ) {
            return;
        }


        const { error } = await supabaseClient
            .from("products")
            .update({
                quantity: quantity
            })
            .eq("id", id);


        if (error) {

            console.error(error);

            showMessage(
                "Miqdor o‘zgartirilmadi.",
                "error"
            );

            return;
        }


        const product =
            products.find(item => item.id === id);

        if (product) {
            product.quantity = quantity;
        }


        updateStats();
        renderStockNotifications();
        renderProducts();
    }


    /* =========================
       + / -
    ========================= */

    async function changeQuantity(id, amount) {

        const product =
            products.find(item => item.id === id);

        if (!product) return;


        const newQuantity =
            Math.max(
                0,
                Number(product.quantity) + amount
            );


        await updateQuantity(
            id,
            newQuantity
        );
    }


    /* =========================
       QO'LDA MIQDOR KIRITISH
    ========================= */

    async function setQuantity(id, input) {

        const value =
            parseInt(input.value, 10);


        if (
            Number.isNaN(value) ||
            value < 0
        ) {

            input.value = 0;

            await updateQuantity(id, 0);

            return;
        }


        await updateQuantity(
            id,
            value
        );
    }


    /* =========================
       MINIMAL MIQDOR
    ========================= */

    async function setLowLimit(id, input) {

        const value =
            parseInt(input.value, 10);


        if (
            Number.isNaN(value) ||
            value < 0
        ) {

            input.value = 0;

            return;
        }


        const { error } = await supabaseClient
            .from("products")
            .update({
                low_limit: value
            })
            .eq("id", id);


        if (error) {

            console.error(error);

            showMessage(
                "Minimal miqdor o‘zgartirilmadi.",
                "error"
            );

            return;
        }


        const product =
            products.find(item => item.id === id);

        if (product) {
            product.low_limit = value;
        }


        updateStats();
        renderStockNotifications();
        renderProducts();
    }


    /* =========================
       TAHRIRLASH
    ========================= */

    function openEdit(id) {

        const product =
            products.find(item => item.id === id);

        if (!product) return;


        editingId = id;


        document.getElementById("editName").value =
            product.name;

        document.getElementById("editQuantity").value =
            product.quantity;

        document.getElementById("editLowLimit").value =
            product.low_limit;


        document
            .getElementById("editModal")
            .classList.add("active");
    }


    function closeEdit() {

        editingId = null;

        document
            .getElementById("editModal")
            .classList.remove("active");
    }


    async function saveEdit() {

        if (!editingId) return;


        const name =
            document
                .getElementById("editName")
                .value
                .trim();

        const quantity =
            parseInt(
                document.getElementById("editQuantity").value,
                10
            );

        const lowLimit =
            parseInt(
                document.getElementById("editLowLimit").value,
                10
            );


        if (!name) {

            showMessage(
                "Mahsulot nomini kiriting.",
                "error"
            );

            return;
        }


        if (
            Number.isNaN(quantity) ||
            quantity < 0
        ) {

            showMessage(
                "Miqdorni to‘g‘ri kiriting.",
                "error"
            );

            return;
        }


        if (
            Number.isNaN(lowLimit) ||
            lowLimit < 0
        ) {

            showMessage(
                "Minimal miqdorni to‘g‘ri kiriting.",
                "error"
            );

            return;
        }


        const { error } = await supabaseClient
            .from("products")
            .update({
                name: name,
                quantity: quantity,
                low_limit: lowLimit
            })
            .eq("id", editingId);


        if (error) {

            console.error(error);

            showMessage(
                "Mahsulot tahrirlanmadi.",
                "error"
            );

            return;
        }


        closeEdit();

        showMessage(
            "Mahsulot yangilandi.",
            "success"
        );


        await loadProducts();
    }


    /* =========================
       O'CHIRISH
    ========================= */

    async function deleteProduct(id) {

        const product =
            products.find(item => item.id === id);


        if (!product) return;


        const confirmed =
            confirm(
                `"${product.name}" mahsulotini o‘chirishni xohlaysizmi?`
            );


        if (!confirmed) return;


        const { error } = await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


        if (error) {

            console.error(error);

            showMessage(
                "Mahsulot o‘chirilmadi.",
                "error"
            );

            return;
        }


        showMessage(
            "Mahsulot o‘chirildi.",
            "success"
        );


        await loadProducts();
    }


    /* =========================
       STATUS
    ========================= */

    function getStatus(product) {

        const quantity =
            Number(product.quantity) || 0;

        const lowLimit =
            Number(product.low_limit) || 0;


        if (quantity === 0) {

            return {
                text: "TUGAGAN",
                className: "out"
            };
        }


        if (quantity <= lowLimit) {

            return {
                text: "KAM QOLDI",
                className: "low"
            };
        }


        return {
            text: "YETARLI",
            className: "good"
        };
    }


    /* =========================
       TABLE
    ========================= */

    function renderProducts() {

        const table =
            document.getElementById("productsTable");


        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        const filtered =
            products.filter(product =>
                String(product.name)
                    .toLowerCase()
                    .includes(search)
            );


        if (filtered.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Mahsulot topilmadi
                    </td>
                </tr>
            `;

            return;
        }


        table.innerHTML =
            filtered.map(product => {

                const status =
                    getStatus(product);


                return `
                    <tr>

                        <td class="product-name">
                            ${escapeHTML(product.name)}
                        </td>

                        <td>

                            <div class="quantity-control">

                                <button
                                    class="qty-btn"
                                    onclick="changeQuantity('${product.id}', -1)"
                                >
                                    −
                                </button>

                                <input
                                    class="quantity-input"
                                    type="number"
                                    min="0"
                                    step="1"
                                    value="${Number(product.quantity) || 0}"
                                    onchange="setQuantity('${product.id}', this)"
                                >

                                <button
                                    class="qty-btn"
                                    onclick="changeQuantity('${product.id}', 1)"
                                >
                                    +
                                </button>

                            </div>

                        </td>

                        <td>

                            <input
                                class="minimum-input"
                                type="number"
                                min="0"
                                step="1"
                                value="${Number(product.low_limit) || 0}"
                                onchange="setLowLimit('${product.id}', this)"
                            >

                        </td>

                        <td>

                            <span class="status ${status.className}">
                                ${status.text}
                            </span>

                        </td>

                        <td>

                            <div class="actions">

                                <button
                                    class="edit-btn"
                                    onclick="openEdit('${product.id}')"
                                >
                                    TAHRIRLASH
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteProduct('${product.id}')"
                                >
                                    O‘CHIRISH
                                </button>

                            </div>

                        </td>

                    </tr>
                `;

            }).join("");
    }


    /* =========================
       STATISTIKA
    ========================= */

    function updateStats() {

        const totalProducts =
            products.length;


        const totalQuantity =
            products.reduce(
                (sum, product) =>
                    sum + (Number(product.quantity) || 0),
                0
            );


        const lowProducts =
            products.filter(product => {

                const quantity =
                    Number(product.quantity) || 0;

                const lowLimit =
                    Number(product.low_limit) || 0;

                return quantity > 0 &&
                       quantity <= lowLimit;

            }).length;


        const outProducts =
            products.filter(product =>
                Number(product.quantity) === 0
            ).length;


        document.getElementById(
            "totalProducts"
        ).textContent =
            totalProducts;


        document.getElementById(
            "totalQuantity"
        ).textContent =
            totalQuantity;


        document.getElementById(
            "lowProducts"
        ).textContent =
            lowProducts;


        document.getElementById(
            "outProducts"
        ).textContent =
            outProducts;
    }


    /* =========================
       OGOHLANTIRISHLAR
    ========================= */

    function renderStockNotifications() {

        const box =
            document.getElementById(
                "stockNotifications"
            );


        const warnings =
            products.filter(product => {

                const quantity =
                    Number(product.quantity) || 0;

                const lowLimit =
                    Number(product.low_limit) || 0;

                return quantity === 0 ||
                       (quantity > 0 &&
                        quantity <= lowLimit);

            });


        if (warnings.length === 0) {

            box.innerHTML = "";

            return;
        }


        box.innerHTML = `

            <div class="notifications">

                <div class="notification-title">
                    OGOHLANTIRISH
                </div>

                ${warnings.map(product => {

                    const quantity =
                        Number(product.quantity) || 0;

                    const lowLimit =
                        Number(product.low_limit) || 0;


                    const isOut =
                        quantity === 0;


                    return `

                        <div class="notification ${isOut ? "notification-out" : "notification-low"}">

                            <strong>
                                ${escapeHTML(product.name)}
                            </strong>

                            <span>
                                ${isOut
                                    ? "Mahsulot tugagan"
                                    : `Miqdor: ${quantity} / Minimal: ${lowLimit}`
                                }
                            </span>

                        </div>

                    `;

                }).join("")}

            </div>
        `;
    }


    /* =========================
       XABAR
    ========================= */

    function showMessage(text, type) {

        const message =
            document.getElementById("message");


        message.className =
            `message ${type}`;


        message.textContent =
            text;


        clearTimeout(
            window.messageTimer
        );


        window.messageTimer =
            setTimeout(() => {

                message.textContent = "";
                message.className = "";

            }, 3000);
    }


    /* =========================
       QIDIRUV
    ========================= */

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            renderProducts
        );


    /* =========================
       ENTER
    ========================= */

    document
        .getElementById("productName")
        .addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {
                    addProduct();
                }

            }
        );


    /* =========================
       MODAL
    ========================= */

    document
        .getElementById("editModal")
        .addEventListener(
            "click",
            event => {

                if (
                    event.target.id === "editModal"
                ) {
                    closeEdit();
                }

            }
        );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {
                closeEdit();
            }

        }
    );


    /* =========================
       AUTO REFRESH
    ========================= */

    setInterval(
        loadProducts,
        5000
    );


    /* =========================
       START
    ========================= */

    loadProducts();

</script>

</body>
</html>
```
